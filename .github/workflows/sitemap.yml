name: Generate Sitemap

on:
  push:
    branches:
      - main  # Change to master if that is your branch name

permissions:
  contents: write  # Grants permission to commit and push changes

jobs:
  sitemap_job:
    runs-on: ubuntu-latest
    name: Generate Sitemap
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Generate SW-Sitemap
      uses: cicirello/generate-sitemap@v1
      with:
        base-url-path: https://johnwestleyturnbull.au/

    - name: Commit and Push Sitemap
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add sitemap.xml
        git diff-index --quiet HEAD || git commit -m "Automated sitemap update"
        git push
