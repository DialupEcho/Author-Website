<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTR-16</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <!-- Load Roboto Flex for the Android 16 menu style -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #111214;
            font-family: 'Courier New', Courier, monospace;
            color: #00ffcc;
            cursor: crosshair;
        }
        canvas {
            display: block;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 20, 30, 0.7);
            border: 1px solid #00ffcc;
            /* Android 16 Squircle border radius */
            border-radius: 16px;
            padding: 20px;
            pointer-events: none;
            box-shadow: 0 4px 16px rgba(0, 255, 204, 0.15);
            font-family: 'Roboto Flex', sans-serif;
            color: #e2e2e2;
            min-width: 180px;
        }
        #hud.hidden {
            display: none;
        }
        #autoButton {
            position: absolute;
            left: 20px;
            bottom: 20px;
            z-index: 2;
            border: 1px solid #39ff88;
            border-radius: 8px;
            padding: 8px 12px;
            background: rgba(17, 18, 20, 0.9);
            color: #39ff88;
            font: 600 11px 'Roboto Flex', sans-serif;
            letter-spacing: 1px;
            cursor: pointer;
        }
        #autoButton.active {
            background: #39ff88;
            color: #111214;
        }
        #menuButton {
            position: absolute;
            left: 20px;
            bottom: 58px;
            z-index: 2;
            border: 1px solid #a0aab4;
            border-radius: 8px;
            padding: 8px 12px;
            background: rgba(17, 18, 20, 0.9);
            color: #e2e2e2;
            font: 600 11px 'Roboto Flex', sans-serif;
            letter-spacing: 1px;
            cursor: pointer;
        }
        #homeButton {
            position: absolute;
            left: 20px;
            bottom: 96px;
            z-index: 2;
            border: 1px solid #a0aab4;
            border-radius: 8px;
            padding: 8px 12px;
            background: rgba(17, 18, 20, 0.9);
            color: #e2e2e2;
            font: 600 11px 'Roboto Flex', sans-serif;
            letter-spacing: 1px;
            text-decoration: none;
        }
        h1 {
            font-variation-settings: 'wght' 600, 'opsz' 24;
            font-size: 16px;
            margin: 0 0 16px 0;
            letter-spacing: 1px;
            color: #00ffcc;
            text-transform: uppercase;
        }
        .data-row {
            font-variation-settings: 'wght' 400, 'opsz' 14;
            font-size: 13px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }
        .controls-hint {
            margin-top: 16px;
            color: #a0aab4;
            font-size: 11px;
            font-variation-settings: 'wght' 400;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 12px;
            border-radius: 9999px; /* Pill shape for Android 16 feel */
            text-align: center;
        }
        .val {
            color: #ffffff;
            font-variation-settings: 'wght' 500;
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body>

    <div id="hud">
        <h1>VTR-16</h1>
        <div class="data-row">
            <span>POS X</span>
            <span class="val" id="posX">0</span>
        </div>
        <div class="data-row">
            <span>POS Y</span>
            <span class="val" id="posY">0</span>
        </div>
        <div class="data-row">
            <span>VEL</span>
            <span class="val" id="vel">0.00</span>
        </div>
        <div class="data-row">
            <span>HDG</span>
            <span class="val" id="heading">0°</span>
        </div>
        <div class="controls-hint">
            Click + hold to steer
        </div>
    </div>
    <button id="menuButton" type="button" aria-expanded="true">HIDE MENU</button>
    <button id="autoButton" type="button" aria-pressed="false">AUTO</button>
    <a id="homeButton" href="index.html">HOME</a>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Ship State
        const ship = {
            x: canvas.width / 2 - 600,
            y: canvas.height / 2,
            vx: 0,
            vy: 0,
            angle: -Math.PI / 2,
            thrustPower: 0.15,
            radius: 12
        };

        // Pointer state
        const pointer = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            active: false,
            dragStartX: canvas.width / 2,
            dragStartY: canvas.height / 2
        };

        function updatePointerPosition(e) {
            const rect = canvas.getBoundingClientRect();
            pointer.x = e.clientX - rect.left;
            pointer.y = e.clientY - rect.top;

            if (pointer.active && landedPlanet && Math.hypot(
                pointer.x - pointer.dragStartX,
                pointer.y - pointer.dragStartY
            ) > 8) {
                landedPlanet = null;
            }
        }

        canvas.addEventListener('pointermove', updatePointerPosition);
        canvas.addEventListener('pointerdown', (e) => {
            if (e.button !== 0) return;
            updatePointerPosition(e);
            pointer.active = true;
            pointer.dragStartX = pointer.x;
            pointer.dragStartY = pointer.y;
            canvas.setPointerCapture(e.pointerId);
        });
        canvas.addEventListener('pointerup', (e) => {
            if (e.button === 0) pointer.active = false;
        });
        canvas.addEventListener('pointercancel', () => {
            pointer.active = false;
        });

        const planetColors = ['#ff477e', '#ff9f43', '#54a0ff', '#c56cf0', '#1dd1a1', '#feca57'];
        const planets = Array.from({ length: 15 }, (_, index) => {
            const goldenRatio = (1 + Math.sqrt(5)) / 2;
            const orbitIndex = index % 5;
            const orbitRadius = 1100 + orbitIndex * 850;
            const angle = index * Math.PI * 2 * goldenRatio + orbitIndex * 0.35;
            return {
                x: canvas.width / 2 + Math.cos(angle) * orbitRadius,
                y: canvas.height / 2 + Math.sin(angle) * orbitRadius,
                radius: 60 + (index % 5) * 20,
                color: planetColors[index % planetColors.length],
                orbitRadius
            };
        });

        const sun = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 180
        };

        const trail = [];
        const trailMaxLength = 90;
        let landedPlanet = null;
        let landedAngle = 0;
        const autoButton = document.getElementById('autoButton');
        const menuButton = document.getElementById('menuButton');
        const autoPilot = {
            active: false,
            target: null,
            waitUntil: 0
        };

        function chooseAutoTarget() {
            const choices = planets.filter(planet => planet !== landedPlanet && planet !== autoPilot.target);
            autoPilot.target = choices[Math.floor(Math.random() * choices.length)] || planets[0];
        }

        function setAutoPilot(active) {
            autoPilot.active = active;
            autoButton.classList.toggle('active', active);
            autoButton.setAttribute('aria-pressed', String(active));
            pointer.active = false;
            autoPilot.waitUntil = 0;

            if (active) chooseAutoTarget();
            else autoPilot.target = null;
        }

        autoButton.addEventListener('click', () => setAutoPilot(!autoPilot.active));
        menuButton.addEventListener('click', () => {
            const hidden = document.getElementById('hud').classList.toggle('hidden');
            menuButton.innerText = hidden ? 'SHOW MENU' : 'HIDE MENU';
            menuButton.setAttribute('aria-expanded', String(!hidden));
        });

        function getPlanetVisualScale(planet, distance = Math.hypot(planet.x - ship.x, planet.y - ship.y)) {
            return Math.max(0.35, Math.min(2.8, 720 / Math.max(distance, 260)));
        }

        function getLandingDistance(planet) {
            const cappedDistance = planet.radius * 2.8 + ship.radius;
            if (cappedDistance <= 260) return cappedDistance;

            // Solve distance = radius * 720 / distance + ship radius.
            return (ship.radius + Math.sqrt(
                ship.radius * ship.radius + 4 * planet.radius * 720
            )) / 2;
        }

        function update() {
            if (landedPlanet) {
                // Keep ship locked precisely on the displayed outer perimeter.
                const landedDistance = getLandingDistance(landedPlanet);
                ship.x = landedPlanet.x + Math.cos(landedAngle) * landedDistance;
                ship.y = landedPlanet.y + Math.sin(landedAngle) * landedDistance;
                ship.vx = 0;
                ship.vy = 0;

                if (autoPilot.active) {
                    if (!autoPilot.waitUntil) autoPilot.waitUntil = performance.now() + 5000;
                    if (performance.now() >= autoPilot.waitUntil) {
                        landedPlanet = null;
                        autoPilot.waitUntil = 0;
                        chooseAutoTarget();
                    }
                }
                return;
            }

            if (autoPilot.active && !autoPilot.target) chooseAutoTarget();

            if (autoPilot.active) {
                const targetAngle = Math.atan2(
                    autoPilot.target.y - ship.y,
                    autoPilot.target.x - ship.x
                );
                let directionX = Math.cos(targetAngle);
                let directionY = Math.sin(targetAngle);

                // Repel nearby non-target planets to route around them.
                planets.forEach(planet => {
                    if (planet === autoPilot.target) return;
                    const offsetX = ship.x - planet.x;
                    const offsetY = ship.y - planet.y;
                    const distance = Math.hypot(offsetX, offsetY);
                    const safeDistance = getLandingDistance(planet) + 180;
                    if (distance < safeDistance) {
                        const strength = (safeDistance - distance) / safeDistance;
                        directionX += (offsetX / Math.max(distance, 1)) * strength * 3;
                        directionY += (offsetY / Math.max(distance, 1)) * strength * 3;
                    }
                });

                // Treat the sun as a large no-fly zone and route around it.
                const sunOffsetX = ship.x - sun.x;
                const sunOffsetY = ship.y - sun.y;
                const sunDistance = Math.hypot(sunOffsetX, sunOffsetY);
                const sunSafeDistance = sun.radius + 320;
                if (sunDistance < sunSafeDistance) {
                    const strength = (sunSafeDistance - sunDistance) / sunSafeDistance;
                    directionX += (sunOffsetX / Math.max(sunDistance, 1)) * strength * 4;
                    directionY += (sunOffsetY / Math.max(sunDistance, 1)) * strength * 4;
                }

                const desiredAngle = Math.atan2(directionY, directionX);
                const angleDifference = Math.atan2(
                    Math.sin(desiredAngle - ship.angle),
                    Math.cos(desiredAngle - ship.angle)
                );
                const maxTurn = 0.045;
                ship.angle += Math.max(-maxTurn, Math.min(maxTurn, angleDifference));
            } else if (pointer.active) {
                ship.angle = Math.atan2(
                    pointer.y - canvas.height / 2,
                    pointer.x - canvas.width / 2
                );
            }

            if (pointer.active || autoPilot.active) {
                const targetDistance = autoPilot.active
                    ? Math.hypot(autoPilot.target.x - ship.x, autoPilot.target.y - ship.y)
                    : Infinity;
                const thrustScale = autoPilot.active
                    ? Math.min(1, Math.max(0.35, targetDistance / 700))
                    : 1;
                ship.vx += Math.cos(ship.angle) * ship.thrustPower * thrustScale;
                ship.vy += Math.sin(ship.angle) * ship.thrustPower * thrustScale;
            }

            ship.vx *= 0.99;
            ship.vy *= 0.99;

            ship.x += ship.vx;
            ship.y += ship.vy;

            // Check collision with any planet's surface
            const touchedPlanet = planets.find(planet => {
                const dist = Math.hypot(ship.x - planet.x, ship.y - planet.y);
                return dist <= getLandingDistance(planet) && (!autoPilot.active || planet === autoPilot.target);
            });
            
            if (touchedPlanet) {
                landedPlanet = touchedPlanet;
                
                // Calculate impact angle from planet center to ship position
                landedAngle = Math.atan2(ship.y - touchedPlanet.y, ship.x - touchedPlanet.x);
                
                // Snap to the displayed edge as soon as the ship overlaps the planet.
                const landingDistance = getLandingDistance(touchedPlanet);
                ship.x = touchedPlanet.x + Math.cos(landedAngle) * landingDistance;
                ship.y = touchedPlanet.y + Math.sin(landedAngle) * landingDistance;
                
                ship.vx = 0;
                ship.vy = 0;
                if (autoPilot.active) autoPilot.waitUntil = performance.now() + 5000;
                // Face outwards perpendicular to the surface
                ship.angle = landedAngle;
            }

            if (Math.hypot(ship.vx, ship.vy) > 0.05) {
                trail.push({ x: ship.x, y: ship.y });
                if (trail.length > trailMaxLength) trail.shift();
            }

            const speed = Math.hypot(ship.vx, ship.vy).toFixed(2);
            const deg = Math.round((ship.angle * 180 / Math.PI) % 360);
            
            document.getElementById('posX').innerText = Math.round(ship.x);
            document.getElementById('posY').innerText = Math.round(ship.y);
            document.getElementById('vel').innerText = speed;
            document.getElementById('heading').innerText = `${deg >= 0 ? deg : deg + 360}°`;
        }

        function draw() {
            ctx.fillStyle = '#111214';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const cameraScale = autoPilot.active ? 0.05 : 1;
            const shipVisualScale = autoPilot.active ? 0.45 : 1;
            const gridSize = 100 * cameraScale;
            const gridOffsetX = ((canvas.width / 2 - ship.x * cameraScale) % gridSize + gridSize) % gridSize;
            const gridOffsetY = ((canvas.height / 2 - ship.y * cameraScale) % gridSize + gridSize) % gridSize;
            ctx.strokeStyle = 'rgba(130, 136, 142, 0.16)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let x = gridOffsetX; x <= canvas.width; x += gridSize) {
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
            }
            for (let y = gridOffsetY; y <= canvas.height; y += gridSize) {
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
            }
            ctx.stroke();

            if (trail.length > 1) {
                ctx.beginPath();
                trail.forEach((point, index) => {
                    const tx = (point.x - ship.x) * cameraScale + canvas.width / 2;
                    const ty = (point.y - ship.y) * cameraScale + canvas.height / 2;
                    if (index === 0) ctx.moveTo(tx, ty);
                    else ctx.lineTo(tx, ty);
                });
                ctx.strokeStyle = 'rgba(57, 255, 136, 0.55)';
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                ctx.stroke();
            }

            planets.forEach(planet => {
                const px = (planet.x - ship.x) * cameraScale + canvas.width / 2;
                const py = (planet.y - ship.y) * cameraScale + canvas.height / 2;
                const distance = Math.hypot(planet.x - ship.x, planet.y - ship.y);
                const visualScale = Math.max(0.35, Math.min(2.8, 720 / Math.max(distance, 260)));
                const visualRadius = planet.radius * visualScale * cameraScale;

                ctx.beginPath();
                ctx.arc(px, py, visualRadius, 0, Math.PI * 2);
                ctx.fillStyle = planet.color;
                ctx.fill();
                ctx.closePath();

                ctx.beginPath();
                ctx.arc(px, py, visualRadius + 8 * visualScale * cameraScale, 0, Math.PI * 2);
                ctx.strokeStyle = `${planet.color}66`;
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.closePath();
            });

            // Draw orbit paths and the massive central sun.
            ctx.strokeStyle = 'rgba(255, 190, 70, 0.16)';
            ctx.lineWidth = 1;
            planets.filter((planet, index) => index < 5).forEach(planet => {
                ctx.beginPath();
                ctx.arc(
                    (sun.x - ship.x) * cameraScale + canvas.width / 2,
                    (sun.y - ship.y) * cameraScale + canvas.height / 2,
                    planet.orbitRadius * cameraScale,
                    0,
                    Math.PI * 2
                );
                ctx.stroke();
            });

            const sunX = (sun.x - ship.x) * cameraScale + canvas.width / 2;
            const sunY = (sun.y - ship.y) * cameraScale + canvas.height / 2;
            const sunRadius = Math.max(sun.radius * cameraScale, autoPilot.active ? 28 : 0);
            const sunGlow = ctx.createRadialGradient(sunX, sunY, sunRadius * 0.35, sunX, sunY, sunRadius * 2.2);
            sunGlow.addColorStop(0, 'rgba(255, 214, 92, 0.95)');
            sunGlow.addColorStop(0.45, 'rgba(255, 145, 38, 0.8)');
            sunGlow.addColorStop(1, 'rgba(255, 91, 31, 0)');
            ctx.fillStyle = sunGlow;
            ctx.beginPath();
            ctx.arc(sunX, sunY, sunRadius * 2.2, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffd65c';
            ctx.beginPath();
            ctx.arc(sunX, sunY, sunRadius, 0, Math.PI * 2);
            ctx.fill();

            // Draw Ship (Centered on screen)
            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.scale(shipVisualScale, shipVisualScale);
            ctx.rotate(ship.angle);

            // Ship Body
            ctx.strokeStyle = '#39ff88';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(15, 0);
            ctx.lineTo(-10, -10);
            ctx.lineTo(-5, 0);
            ctx.lineTo(-10, 10);
            ctx.closePath();
            ctx.stroke();

            if (pointer.active && !landedPlanet) {
                ctx.fillStyle = '#ff5500';
                ctx.beginPath();
                ctx.moveTo(-7, -5);
                ctx.lineTo(-18, 0);
                ctx.lineTo(-7, 5);
                ctx.fill();
            }

            ctx.restore();

            // Draw the flag after the ship so its straight pole stays visible.
            if (landedPlanet) {
                ctx.save();
                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.scale(shipVisualScale, shipVisualScale);
                ctx.rotate(ship.angle);

                ctx.strokeStyle = '#39ff88';
                ctx.lineWidth = 2;
                ctx.lineCap = 'butt';
                ctx.lineJoin = 'miter';
                const shipTipX = 15;
                const shipTipY = 0;
                const flagPoleLength = 28;
                const flagEndX = shipTipX + flagPoleLength;
                const flagEndY = shipTipY;
                ctx.beginPath();
                ctx.moveTo(shipTipX, shipTipY);
                ctx.lineTo(flagEndX, flagEndY);
                ctx.stroke();

                // Triangular pennant projecting off the pole like a real flag.
                ctx.beginPath();
                ctx.moveTo(shipTipX + 10, flagEndY);
                ctx.lineTo(flagEndX, flagEndY);
                ctx.lineTo(shipTipX + 20, flagEndY - 16);
                ctx.closePath();
                ctx.stroke();
                ctx.restore();
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
